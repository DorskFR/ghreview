name: ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ghreview: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ghreview == 'true' }}
      ghreview-ui: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ghreview-ui == 'true' }}
      deps: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            ghreview:
              - *ci
              - ghreview/**
            ghreview-ui:
              - *ci
              - ghreview-ui/**
            deps:
              - *ci
              - ghreview/bun.lock
              - ghreview-ui/bun.lock

  biome:
    name: biome (repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Formatting of the shared json/yaml/md at the repo root. Each package
      # lints its own sources in its own job.
      - name: biome check
        run: npx --yes @biomejs/biome@2.5.6 check .

  ghreview:
    name: ghreview
    needs: changes
    if: needs.changes.outputs.ghreview == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgautoupgrade/pgautoupgrade:18-debian@sha256:5994de3d344b9c9676b571d10ff8259e155013f4e5477c58ceee74a42f6d2d20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        working-directory: ghreview
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ghreview
        run: bun run typecheck

      - name: Lint
        working-directory: ghreview
        run: bun run lint

      - name: Test
        working-directory: ghreview
        run: bun test

  ghreview-ui:
    name: ghreview-ui
    needs: changes
    if: needs.changes.outputs.ghreview-ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Shared runtime versions match the host
        run: |
          bash ghreview-ui/scripts/check-host-deps.test.sh
          bash ghreview-ui/scripts/check-host-deps.sh

      - name: Install dependencies
        working-directory: ghreview-ui
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ghreview-ui
        run: bun run typecheck

      - name: Lint
        working-directory: ghreview-ui
        run: bun run lint

      - name: Test
        working-directory: ghreview-ui
        run: bun run test

      - name: Build
        working-directory: ghreview-ui
        run: bun run build

      - name: Build the plugin archive
        working-directory: ghreview-ui
        run: bun run build:plugin

  generated-artifacts:
    name: generated artifacts up to date
    needs: changes
    if: needs.changes.outputs.ghreview == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        working-directory: ghreview
        run: bun install --frozen-lockfile

      - name: Regenerate the OpenAPI document + typed client
        working-directory: ghreview
        run: bun run gen

      - name: Committed artifacts match the generators
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated artifacts are stale. Run 'cd ghreview && bun run gen' and commit the result."
            exit 1
          fi

  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install ghreview dependencies
        working-directory: ghreview
        run: bun install --frozen-lockfile

      - name: bun audit (ghreview)
        working-directory: ghreview
        run: bun audit

      - name: Install ghreview-ui dependencies
        working-directory: ghreview-ui
        run: bun install --frozen-lockfile

      # Advisory: frontend advisories routinely have no upgrade path, and a
      # dev-only finding must not block a merge.
      - name: bun audit (ghreview-ui)
        working-directory: ghreview-ui
        continue-on-error: true
        run: bun audit

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: actionlint
        run: ./actionlint -color

  # The single required check for branch protection: skipped jobs count as
  # passing, failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - biome
      - ghreview
      - ghreview-ui
      - generated-artifacts
      - audit
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
