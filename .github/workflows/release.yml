name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  meta:
    name: resolve version + channel
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.channel.outputs.tag }}
      version: ${{ steps.channel.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      floating_tag: ${{ steps.channel.outputs.floating_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # vX.Y.Z-beta.N is a pre-release that never becomes latest and moves the
      # :beta image tag instead of :latest.
      - name: Resolve version and channel
        id: channel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          case "$version" in
            *-*) prerelease=true; floating_tag="${version##*-}"; floating_tag="${floating_tag%%.*}" ;;
            *)   prerelease=false; floating_tag=latest ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "floating_tag=$floating_tag"
          } >> "$GITHUB_OUTPUT"

      # The tag is the single source of truth, and plugin.json is stamped from
      # it — a manifest that disagrees with the package would ship a plugin
      # whose version does not match its archive name.
      - name: Package versions match the tag
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          status=0
          for pkg in ghreview/package.json ghreview-ui/package.json; do
            got="$(node -p "require('./$pkg').version")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$pkg is $got, tag says $VERSION"
              status=1
            fi
          done
          exit "$status"

  plugin:
    name: plugin archive
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        working-directory: ghreview-ui
        run: bun install --frozen-lockfile

      - name: Build the plugin archive
        id: pack
        working-directory: ghreview-ui
        env:
          GHREVIEW_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          bun run build:plugin
          tgz="dist/ghreview-${GHREVIEW_VERSION}.tgz"
          [ -f "$tgz" ] || { echo "::error::$tgz was not produced"; exit 1; }
          manifest_version="$(node -p "require('./dist/plugin/plugin.json').version")"
          [ "$manifest_version" = "$GHREVIEW_VERSION" ] || {
            echo "::error::plugin.json says $manifest_version, expected $GHREVIEW_VERSION"; exit 1; }
          sha256="$(sha256sum "$tgz" | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### ghreview-${GHREVIEW_VERSION}.tgz"
            echo
            echo '```'
            echo "sha256  $sha256"
            echo '```'
            echo
            echo "Catalog entry sha256 for this release: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-archive
          path: ghreview-ui/dist/ghreview-*.tgz
          if-no-files-found: error

  # linux/amd64 only. The gha layer cache is scoped per image so unchanged
  # layers are reused across releases.
  image:
    name: image
    needs: meta
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ghreview
          file: ghreview/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=ghreview
          cache-to: type=gha,mode=max,scope=ghreview
          tags: |
            ghcr.io/dorskfr/ghreview:${{ needs.meta.outputs.version }}
            ghcr.io/dorskfr/ghreview:${{ needs.meta.outputs.floating_tag }}

  release:
    name: github release
    needs: [meta, plugin, image]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plugin-archive
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Backend image: `ghcr.io/dorskfr/ghreview:${{ needs.meta.outputs.version }}`

            Plugin archive `ghreview-${{ needs.meta.outputs.version }}.tgz`
            sha256: `${{ needs.plugin.outputs.sha256 }}`
          files: dist/ghreview-*.tgz
